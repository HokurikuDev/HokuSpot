<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HokuSpot</title>
  <meta name="description" content="A community map of tourist spots, abandoned places, and interesting roads across Ishikawa and Toyama, Japan." />

  <!-- MapLibre GL (open-source Mapbox GL fork — no usage fees) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- Supabase JS client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <!-- Display font for headings — characterful but restrained -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/panel.css" />
  <link rel="stylesheet" href="css/modal.css" />
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <header id="top-bar">
      <div class="brand">
        <span class="brand__mark">HokuSpot</span>
      </div>
      <div id="auth-area"><!-- populated by ui.js --></div>
    </header>

    <nav id="category-filters" aria-label="Filter by category">
      <!-- populated by app.js -->
    </nav>

    <aside id="detail-panel" aria-label="Place details"></aside>
    <aside id="submit-panel" aria-label="Add a place"></aside>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
